[project]
name = "my-personal-assisstant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sh1va-sync", email = "shivachary.ul@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=0.6.3",
    "fastapi>=0.115.0",
    "google-genai>=1.14.0",
    "httpx>=0.27.0",
    "langchain-core>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "python-dotenv>=1.0.1",
    "slowapi>=0.1.9",
    "uvicorn[standard]>=0.32.0",
]

[project.scripts]
my-personal-assisstant = "my_personal_assisstant:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
